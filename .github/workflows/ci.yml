name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Challenge 1 will teach you to narrow this with paths / if conditions.
# Challenge 4 will teach you to cache pip correctly.

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Challenge 4: enable caching here or with actions/cache

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  # Intentional signal for learners reading the summary UI:
  # when tests fail, this job is skipped via needs — same idea as a later GitLab stage.
  summarize:
    name: summarize
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Report matrix result
        run: |
          echo "test job result: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Matrix tests did not pass. Open a failed 'test' job and read the pytest output."
            exit 1
          fi
          echo "All matrix legs green."
