name: ci

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"

# GitLab mapping: the `on.*.paths` lists above are this repo's `rules: - changes: [src/**, tests/**, .github/workflows/**]` — docs-only pushes match nothing, so the pipeline never starts.
#
# Consequence: a commit touching only *.md or docs/** produces NO workflow run at all
# (GitHub shows no entry, unlike GitLab which shows a skipped/ignored pipeline).
# Proof of both halves lives in docs/path-filters-proof.md.
#
# Challenge 4 will teach you to cache pip correctly.

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Challenge 4: enable caching here or with actions/cache

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  # Intentional signal for learners reading the summary UI:
  # when tests fail, this job is skipped via needs — same idea as a later GitLab stage.
  summarize:
    name: summarize
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Report matrix result
        run: |
          echo "test job result: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Matrix tests did not pass. Open a failed 'test' job and read the pytest output."
            exit 1
          fi
          echo "All matrix legs green."
